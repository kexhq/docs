name: Publish

# Builds docs.kex.run and publishes it to this repository's gh-pages branch,
# which GitHub Pages serves.
#
# Two things make up the site: the pages authored here with Marqraft
# (content/, .marqraft/, the Krix theme) and the reference kexhq/kex
# generates from source. kexhq/kex force-pushes that reference to this
# repository's `reference` branch and then sends `reference-updated`; an edit
# to the authored pages arrives as a push to main. Either way the whole site
# is rebuilt from both.
#
# A pull request runs the same build without publishing, as the `build`
# check the main branch's ruleset requires: a change that breaks the site
# fails before it merges.
on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [reference-updated]
  workflow_dispatch:

# Publishes share one group, so a newer one replaces one still running; each
# pull request builds in a group of its own, so a PR never cancels a publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-{0}', github.ref) || 'publish' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check out the generated reference
        uses: actions/checkout@v4
        with:
          ref: reference
          path: generated

      - name: Check out Marqraft
        uses: actions/checkout@v4
        with:
          repository: Marqraft/cli
          path: .marqraft-cli

      # Kex and Tey from a pinned release: building Kex from kexhq/kex main
      # took most of each run and broke the site whenever main moved. Bump
      # KEX_VERSION together with Marqraft/cli's main.
      # Kex needs OTP 27+, and ubuntu-latest's erlang-base is OTP 25.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"

      - name: Install Kex and Tey
        env:
          KEX_VERSION: 0.4.0-rc.4
        run: |
          curl -fsSL "https://raw.githubusercontent.com/kexhq/kex/v$KEX_VERSION/install.sh" | sh -s -- --kex "$KEX_VERSION"
          echo "$HOME/.local/share/tey/dist/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/tey/bin" >> "$GITHUB_PATH"

      - name: Verify guide examples
        run: python3 scripts/check-guide-examples.py

      - name: Build marq
        working-directory: .marqraft-cli
        run: |
          tey install
          tey build

      # marq renders theme templates with the `kex` on PATH (or TEY_KEX).
      - name: Build the site
        run: escript .marqraft-cli/ebin/marq build .

      # llms.txt, llms-full.txt, sitemap.xml, robots.txt and CNAME: the files
      # that describe the whole site, authored and generated pages alike.
      - name: Site-wide files
        run: kex --run scripts/finish.kex -- . https://docs.kex.run

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          cname: docs.kex.run
          enable_jekyll: false
          commit_message: "publish: ${{ github.event_name }} ${{ github.event.client_payload.ref || github.sha }}"
